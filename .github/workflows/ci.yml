name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend[dev]'
      - run: ruff check backend
      - run: pytest backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        with:
          files: compose.yaml
          load: false

  create-pull-request:
    if: github.event_name == 'push' && github.ref_name != 'main'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create pull request if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh pr view "$GITHUB_REF_NAME" --json url >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$GITHUB_REF_NAME" \
              --title "Job Compass: ${GITHUB_REF_NAME}" \
              --body "Automated pull request created after backend, frontend, and Docker checks passed."
          fi
