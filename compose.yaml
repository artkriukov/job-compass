services:
  backend:
    build:
      context: ./backend
    environment:
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-auto}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-240}
      MAX_SITES: ${MAX_SITES:-20}
      MAX_RESULTS: ${MAX_RESULTS:-100}
      SUPABASE_URL: ${SUPABASE_URL:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

